# ShelfIQ v3.0 — Docker Compose (Development)
# Usage: docker compose up --build

services:
  # ── PostgreSQL ──────────────────────────────────────
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: shelfiq
      POSTGRES_USER: shelfiq
      POSTGRES_PASSWORD: shelfiq_dev_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shelfiq"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ── Redis ───────────────────────────────────────────
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ── FastAPI Backend ─────────────────────────────────
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://shelfiq:shelfiq_dev_password@postgres:5432/shelfiq
      REDIS_URL: redis://redis:6379/0
      ENVIRONMENT: development
      JWT_SECRET_KEY: shelfiq-dev-secret-change-in-production-please
      FIELD_ENCRYPTION_KEY: "0123456789abcdef0123456789abcdef"
      ALLOWED_ORIGINS: "http://localhost:5173,http://localhost:3000"
    volumes:
      - .:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: uvicorn backend.app.main:app --host 0.0.0.0 --port 8000 --reload

  # ── Celery CV Worker (GPU) ──────────────────────────
  celery-cv:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: postgresql+asyncpg://shelfiq:shelfiq_dev_password@postgres:5432/shelfiq
      REDIS_URL: redis://redis:6379/0
    volumes:
      - .:/app
    depends_on:
      - redis
      - postgres
    command: celery -A backend.app.workers.tasks worker --loglevel=info -Q cv_pipeline --concurrency=2

  # ── Celery Forecast Worker ──────────────────────────
  celery-forecast:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: postgresql+asyncpg://shelfiq:shelfiq_dev_password@postgres:5432/shelfiq
      REDIS_URL: redis://redis:6379/0
    volumes:
      - .:/app
    depends_on:
      - redis
      - postgres
    command: celery -A backend.app.workers.tasks worker --loglevel=info -Q forecast

  # ── Celery Alert Worker ─────────────────────────────
  celery-alerts:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: postgresql+asyncpg://shelfiq:shelfiq_dev_password@postgres:5432/shelfiq
      REDIS_URL: redis://redis:6379/0
      WHATSAPP_ACCESS_TOKEN: ${WHATSAPP_ACCESS_TOKEN:-}
      WHATSAPP_PHONE_NUMBER_ID: ${WHATSAPP_PHONE_NUMBER_ID:-}
    volumes:
      - .:/app
    depends_on:
      - redis
      - postgres
    command: celery -A backend.app.workers.tasks worker --loglevel=info -Q whatsapp_alerts,digest_alerts

  # ── Celery Beat (Scheduler) ─────────────────────────
  celery-beat:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: postgresql+asyncpg://shelfiq:shelfiq_dev_password@postgres:5432/shelfiq
      REDIS_URL: redis://redis:6379/0
    volumes:
      - .:/app
    depends_on:
      - redis
    command: celery -A backend.app.workers.tasks beat --loglevel=info

  # ── React Frontend ─────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    volumes:
      - ./frontend/src:/app/src
    command: npm run dev -- --host 0.0.0.0

  # ── Nginx (Production Proxy) ────────────────────────
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
      - frontend
    profiles:
      - production

volumes:
  postgres_data:
