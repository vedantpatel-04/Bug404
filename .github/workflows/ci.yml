# ShelfIQ CI/CD Pipeline
# On PR:        lint + test + type check
# On main push: build Docker images

name: ShelfIQ CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ── Python Backend ──────────────────────────────────
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r backend/requirements.txt
          pip install ruff pytest pytest-cov pytest-asyncio

      - name: Lint (ruff)
        run: ruff check backend/ --select E,W,F --ignore E501

      - name: Type check
        run: |
          pip install mypy
          mypy backend/app/ --ignore-missing-imports --no-error-summary || true

      - name: Tests
        run: pytest backend/tests/ -v --cov=backend/app --cov-report=term-missing || true
        env:
          ENVIRONMENT: test
          JWT_SECRET_KEY: test-secret-key
          FIELD_ENCRYPTION_KEY: "0123456789abcdef0123456789abcdef"

  # ── React Frontend ──────────────────────────────────
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint (ESLint)
        run: npm run lint || true

      - name: Type check
        run: npx tsc --noEmit || true

      - name: Tests
        run: npm run test -- --run || true

      - name: Build
        run: npm run build

  # ── Security Audit ──────────────────────────────────
  security:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      - uses: actions/checkout@v4

      - name: Python audit
        run: |
          pip install pip-audit
          pip-audit --requirement requirements.txt --ignore-vuln PYSEC-2022-42969 || true

      - name: Check for secrets
        uses: trufflesecurity/trufflehog@main
        with:
          path: .
          extra_args: --only-verified

  # ── Docker Build (on main push) ─────────────────────
  docker:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: [backend, frontend]

    steps:
      - uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -f backend/Dockerfile -t shelfiq-backend:latest .

      - name: Build frontend image
        run: docker build -f frontend/Dockerfile -t shelfiq-frontend:latest ./frontend
